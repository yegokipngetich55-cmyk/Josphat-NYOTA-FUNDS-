<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B0217">
<title>My Business Payment</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    padding:16px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:#0B0217;
    color:#fff;
}
.container{width:100%;max-width:430px}
.card{
    width:100%;
    padding:22px 18px;
    border-radius:18px;
    background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
    border:1px solid rgba(255,255,255,.10);
    box-shadow:0 20px 60px rgba(0,0,0,.45);
}
h1{text-align:center;font-size:22px}
p{text-align:center;color:rgba(255,255,255,.75)}
.amount{
    margin:18px 0;
    padding:14px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:bold;
    background:rgba(155,53,255,.08);
}
label{display:block;margin:15px 0 7px;font-weight:bold}
input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.07);
    color:white;
}
button{
    width:100%;
    padding:15px;
    margin-top:18px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#9B35FF,#6C1DCE);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}
button:disabled{opacity:.6}
.success{color:#6DFFAA}
.error{color:#FF7D8A}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>Processing Fee</h1>

<p>Welcome, <strong id="name">Customer</strong></p>
<p>Please complete the payment below.</p>

<div class="amount" id="feeAmount">KSh 350</div>

<label>Full Name</label>
<input id="fullName" readonly>

<label>M-PESA Phone Number</label>
<input id="phone" placeholder="2547XXXXXXXX">

<button id="payBtn">Pay Now</button>

<p id="message"></p>

</div>
</div>

<script>
"use strict";

const BACKEND_URL="https://nyota-funds-p1v3.onrender.com";

const customer=localStorage.getItem("customerName")||"Customer";
const fee=Number(localStorage.getItem("processingFee")||350);

document.getElementById("name").textContent=customer;
document.getElementById("fullName").value=customer;
document.getElementById("feeAmount").textContent="KSh "+fee.toLocaleString("en-KE");

const phoneEl=document.getElementById("phone");
const btn=document.getElementById("payBtn");
const msg=document.getElementById("message");

function setMessage(text,type=""){
    msg.textContent=text;
    msg.className=type;
}

function normalizePhone(value){
    let phone=value.replace(/[^\d+]/g,"");
    if(phone.startsWith("+254")) phone=phone.slice(1);
    if(phone.startsWith("07")||phone.startsWith("01")) phone="254"+phone.slice(1);
    return phone;
}

function validPhone(phone){
    return /^254(?:7|1)\d{8}$/.test(phone);
}

async function readJson(response){
    const text=await response.text();

    if(!text) return {};

    try{
        return JSON.parse(text);
    }catch{
        console.error("Server response:",text);
        throw new Error(`Server returned non-JSON (${response.status})`);
    }
}

btn.addEventListener("click",async()=>{

    const phone=normalizePhone(phoneEl.value);

    if(!validPhone(phone)){
        setMessage("Enter a valid Kenyan number.","error");
        return;
    }

    btn.disabled=true;
    btn.textContent="Sending...";
    setMessage("Sending payment request...");

    try{

        const response=await fetch(BACKEND_URL+"/api/payment",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                phone,
                amount:fee,
                name:customer
            })
        });

        const data=await readJson(response);

        if(!response.ok||!data.success){
            throw new Error(data.message||"Payment request failed.");
        }

        setMessage("Payment request sent successfully.","success");

    }catch(err){
        setMessage(err.message,"error");
    }

    btn.disabled=false;
    btn.textContent="Pay Now";

});
</script>

</body>
</html>
